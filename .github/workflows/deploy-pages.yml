name: Deploy Next.js static site to Pages

# Production Pages deploy. Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Preserve existing PR previews from live site
        env:
          PAGES_SITE_URL: https://mitesh-mokko.github.io/product-idea-loop
        run: |
          set -euo pipefail
          mkdir -p out/pr-preview
          if wget -q --spider "${PAGES_SITE_URL}/pr-preview/"; then
            wget -e robots=off -r -np -nH --cut-dirs=2 \
              -P /tmp/existing-previews \
              "${PAGES_SITE_URL}/pr-preview/" || true
            if [ -d /tmp/existing-previews ]; then
              shopt -s nullglob
              for dir in /tmp/existing-previews/pr-*; do
                [ -d "$dir" ] || continue
                name="$(basename "$dir")"
                cp -a "$dir" "out/pr-preview/${name}"
              done
            fi
          fi

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
