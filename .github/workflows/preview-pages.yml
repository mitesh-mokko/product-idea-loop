name: Deploy PR preview to Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_SITE_URL: https://mitesh-mokko.github.io/product-idea-loop
  PRODUCTION_BASE_PATH: /product-idea-loop

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (production source)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production static export
        run: npm run build

      - name: Mirror existing PR previews from live site
        run: |
          set -euo pipefail
          mkdir -p out/pr-preview
          if wget -q --spider "${PAGES_SITE_URL}/pr-preview/"; then
            wget -e robots=off -r -np -nH --cut-dirs=2 \
              -P /tmp/existing-previews \
              "${PAGES_SITE_URL}/pr-preview/" || true
            if [ -d /tmp/existing-previews ]; then
              shopt -s nullglob
              for dir in /tmp/existing-previews/pr-*; do
                [ -d "$dir" ] || continue
                name="$(basename "$dir")"
                rm -rf "out/pr-preview/${name}"
                cp -a "$dir" "out/pr-preview/${name}"
              done
            fi
          fi

      - name: Remove closed PR preview folder
        if: github.event.action == 'closed'
        run: rm -rf "out/pr-preview/pr-${{ github.event.pull_request.number }}"

      - name: Build and attach PR preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_BASE_PATH: ${{ env.PRODUCTION_BASE_PATH }}/pr-preview/pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cp -a out /tmp/production-out
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git checkout FETCH_HEAD
          NEXT_PUBLIC_BASE_PATH="${PREVIEW_BASE_PATH}" npm run build
          rm -rf "/tmp/production-out/pr-preview/pr-${{ github.event.pull_request.number }}"
          mkdir -p "/tmp/production-out/pr-preview/pr-${{ github.event.pull_request.number }}"
          shopt -s dotglob
          for entry in out/*; do
            base="$(basename "$entry")"
            cp -a "$entry" "/tmp/production-out/pr-preview/pr-${{ github.event.pull_request.number }}/${base}"
          done
          rm -rf out
          mv /tmp/production-out out

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload combined site for dispatch deploy
        uses: actions/upload-artifact@v4
        with:
          name: combined-pages-site
          path: ./out
          retention-days: 1

      - name: Queue Pages deploy on main (github-pages environment policy)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages-artifact.yml',
              ref: 'main',
              inputs: {
                source_run_id: String(context.runId),
                pr_number: String(context.payload.pull_request.number),
                pr_head_sha: context.payload.pull_request.head.sha.substring(0, 7),
                preview_action: context.payload.action,
              },
            });
